[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection"
version = "0.1.0"
description = "AI-Powered Behavioral Anomaly Detection for Cybersecurity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "torch>=2.9.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "faker>=25.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "lightgbm>=4.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<0.5.0",
    "mypy>=1.10.0,<1.11.0",
    "pre-commit>=3.7.0,<3.8.0",
    "pip-tools>=7.0.0,<8.0.0"
]

[tool.pytest.ini_options]
markers = [
    "tier1: marks tests for Tier 1 functionality (core)",
    "tier2: marks tests for Tier 2 functionality (cold start, drift, streaming)",
    "tier3: marks tests for Tier 3 functionality (advanced, demo)"
]
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["torch.*", "captum.*", "sklearn.*", "shap.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true
